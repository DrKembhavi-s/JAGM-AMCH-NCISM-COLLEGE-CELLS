<header>
  <h1>Jain AGM Ayurvedic Medical College &amp; Hospital, Varur</h1>
  <p>Institutional Cells – Documentation &amp; Records Management System</p>
</header>
<div id="tab-bar"></div>
<div id="panels-container"></div>

<script>
// ── CELL REGULATORY DATA ──────────────────────────────────────────────────────
const CELL_INFO = {
  anti_ragging:{
    basis:`The Anti-Ragging Cell is constituted in compliance with the Supreme Court of India directives (SLP No. 24295/2006), UGC Regulations on Curbing the Menace of Ragging in Higher Educational Institutions 2009, and CCIM/NCISM guidelines for Ayurveda Medical Colleges. Section 26(1)(g) of the University Grants Commission Act, 1956 empowers UGC to frame such regulations. The Honourable Supreme Court in its judgment dated 16 May 2007 mandated all Higher Educational Institutions to constitute Anti-Ragging Committees and Squads. This cell is further mandated under the affiliating university statutes and the All India Council for Technical Education (AICTE) guidelines as applicable.`,
    freq_default:'Quarterly (minimum 4 meetings per academic year)',
    roles:{
      'Chairperson':'Overall responsibility for implementation of anti-ragging policies; presides over all meetings; takes final decisions on complaints; ensures compliance with UGC/NCISM/Supreme Court directives; submits annual anti-ragging report to affiliating university.',
      'Nodal Officer / Convener':'Coordinates day-to-day functioning of the cell; receives and registers complaints; maintains complaint register; liaises with police and district authorities; organises awareness programmes; prepares agenda and minutes of meetings.',
      'Member (Faculty)':'Participates in inquiry committees constituted to investigate ragging complaints; assists in awareness campaigns; monitors student behaviour in campus and hostel areas; reports incidents to Nodal Officer.',
      'Member (Administrative)':'Maintains all administrative records of the cell; assists in documentation; coordinates hostel wardens; ensures display of anti-ragging notices and helpline numbers across campus.',
      'Warden – Boys Hostel':'Monitors boys hostel premises; reports any ragging incidents immediately; ensures seniors and juniors are sensitised at the start of each academic year; maintains hostel discipline.',
      'Warden – Girls Hostel':'Monitors girls hostel premises; reports any ragging incidents immediately; ensures seniors and juniors are sensitised at the start of each academic year; maintains hostel discipline.',
      'Student Representative':'Acts as peer sensitiser; reports ragging incidents observed; participates in awareness drives; assists in maintaining a ragging-free campus culture.',
      'Member (Non-Teaching Staff)':'Reports observed incidents; assists in maintaining campus discipline; participates in awareness activities.',
      'Member (Police Liaison)':'Provides interface with local law enforcement; assists in cases requiring police intervention; advises committee on legal procedures.',
    }
  },
  icc:{
    basis:`The Internal Complaints Committee (ICC) is constituted under Section 4 of the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013 (Central Act 14 of 2013). Every employer with 10 or more employees is legally mandated to constitute an ICC. This is further reinforced by NCISM Regulations 2021 and the affiliating university's statutes. The committee operates in accordance with the SH Act 2013 and the rules framed thereunder, ensuring a safe and dignified working and learning environment for all women employees and students.`,
    freq_default:'As required (complaint-based); mandatory annual awareness meeting',
    roles:{
      'Presiding Officer':'Senior female employee who presides over the ICC; leads all inquiry proceedings; ensures fair and time-bound inquiry (within 90 days); submits inquiry report and recommendations to the Principal/Management; presides over awareness meetings.',
      'Member (Internal – Female)':'Participates in inquiry proceedings; assists Presiding Officer; reviews evidence and submissions; signs inquiry report; maintains confidentiality of all proceedings.',
      'Member (Internal)':'Supports inquiry process; provides departmental perspective; assists in maintaining records; ensures compliance with SH Act timelines.',
      'Member (Non-Teaching – Female)':'Represents non-teaching staff perspective; participates in inquiry; assists in awareness activities for non-teaching staff.',
      'Member (External – NGO)':'Independent member from an NGO committed to women\'s causes; provides external oversight; ensures impartiality of proceedings; guides the committee on legal and procedural matters.',
      'Legal Expert / Advocate':'Advises the committee on legal aspects of complaints; assists in interpreting the SH Act and rules; reviews inquiry reports for legal compliance.',
    }
  },
  sc_st:{
    basis:`The SC/ST Cell is constituted in accordance with the Constitutional provisions under Articles 15, 16, 17, and 46 of the Constitution of India; the Scheduled Castes and the Scheduled Tribes (Prevention of Atrocities) Act, 1989; UGC guidelines for SC/ST Cells in Higher Educational Institutions; and NCISM Regulations 2021. The cell ensures equal opportunity, prevents discrimination, and facilitates the academic and personal development of students belonging to Scheduled Castes and Scheduled Tribes categories, in line with the National Policy for Weaker Sections.`,
    freq_default:'Biannual (minimum 2 meetings per academic year)',
    roles:{
      'Chairperson':'Overall responsibility for SC/ST Cell functioning; ensures non-discrimination policies are implemented; reviews grievances escalated to the principal level; presides over annual review meeting.',
      'Liaison Officer / Convener':'Primary point of contact for SC/ST students; receives and addresses grievances; maintains grievance register; coordinates scholarship and welfare schemes; liaises with State SC/ST Department; prepares annual report.',
      'Member (Faculty)':'Mentors SC/ST students academically; reports discriminatory incidents; participates in awareness activities; assists Liaison Officer in grievance redressal.',
      'Member (Administrative)':'Maintains records of SC/ST students; assists in scholarship documentation; ensures fee concession benefits are properly administered.',
      'Student Representative':'Bridges communication between SC/ST students and cell; brings forward concerns of peers; participates in orientation programmes for new students.',
      'Member (Non-Teaching Staff)':'Supports cell activities; reports observed incidents of discrimination; participates in sensitisation programmes.',
    }
  },
  grievance:{
    basis:`The Student Grievance Redressal Cell is constituted in compliance with UGC (Redressal of Grievances of Students) Regulations 2019, NCISM Regulations 2021, and the affiliating university's student welfare statutes. These regulations mandate every Higher Educational Institution to establish a mechanism for fair and time-bound redressal of student grievances related to academics, examinations, admissions, hostel facilities, and other institutional matters. The cell operates transparently and ensures that no student suffers on account of raising a legitimate grievance.`,
    freq_default:'Monthly (minimum 12 meetings per academic year)',
    roles:{
      'Chairperson':'Presides over grievance hearings; takes final institutional decision on escalated complaints; ensures compliance with UGC Grievance Regulations; submits annual grievance report to affiliating university.',
      'Convener':'Receives, registers, and acknowledges all student grievances within 3 working days; coordinates inquiry process; maintains grievance register and disposal register; prepares meeting agenda and minutes.',
      'Member (Clinical Faculty)':'Addresses grievances related to clinical postings, OPD/IPD rotations, and clinical training; participates in inquiry committees.',
      'Member (Basic Science Faculty)':'Addresses grievances related to theory classes, practicals, and basic science departments; participates in inquiry committees.',
      'Member (Administrative)':'Addresses administrative grievances (hostel, fees, documentation); maintains records; assists in implementing redressal decisions.',
      'Student Representative (Male)':'Represents male student interests; brings systemic issues to the cell\'s notice; assists in peer-level resolution of minor grievances.',
      'Student Representative (Female)':'Represents female student interests; brings systemic issues to the cell\'s notice; assists in peer-level resolution of minor grievances.',
      'Member (Non-Teaching)':'Represents non-teaching staff perspective on student-staff issues; assists in redressal of facility-related grievances.',
    }
  },
  alumni:{
    basis:`The Alumni Cell is constituted in accordance with NCISM Regulations 2021, which mandate Ayurveda Medical Colleges to maintain active alumni networks to support institutional development, student mentorship, and professional networking. The cell is further constituted in line with UGC guidelines for Alumni Associations and the affiliating university's statutes. The cell facilitates lifelong engagement between the institution and its graduates, leveraging alumni expertise for curriculum enrichment, placement support, and institutional advancement.`,
    freq_default:'Biannual (minimum 2 formal meetings per academic year; annual alumni meet)',
    roles:{
      'Chairperson':'Provides institutional leadership to the alumni cell; presides over annual alumni meet; approves major alumni engagement programmes; facilitates MoU and collaboration opportunities brought by alumni.',
      'Convener / Coordinator':'Maintains updated alumni database; organises alumni meets and webinars; coordinates alumni mentorship programmes; manages alumni communication; prepares annual alumni activity report.',
      'Member (Faculty)':'Maintains contact with alumni in their specialty area; facilitates alumni guest lectures and clinical demonstrations; mentors current students through alumni connections.',
      'Member (Administrative)':'Maintains alumni records and contact database; manages alumni correspondence; coordinates logistics of alumni events.',
      'President – Alumni Association':'Leads the alumni association; represents alumni interests to the institution; organises alumni chapter activities; chairs alumni association meetings.',
      'Secretary – Alumni Association':'Maintains alumni association records and minutes; coordinates with institutional alumni cell; manages alumni membership; assists in organising events.',
      'Member (Alumni – Senior Batch)':'Represents senior alumni perspective; mentors junior alumni; contributes to institutional development through experience sharing.',
      'Member (Alumni – Recent Batch)':'Represents recent graduates\' perspective; assists in placement and internship guidance; connects current students with industry opportunities.',
    }
  },
  entrepreneurship:{
    basis:`The Entrepreneurship and Career Guidance Cell is constituted in accordance with NCISM Regulations 2021, Ministry of AYUSH guidelines on AYUSH entrepreneurship promotion, and the National Education Policy 2020 which emphasises skill development and entrepreneurship education. The cell is further constituted in line with the Startup India initiative and MSME Ministry guidelines for academic entrepreneurship cells. Its mandate is to equip Ayurveda graduates with entrepreneurial skills, career guidance, and industry linkages to promote self-employment and innovation in the AYUSH sector.`,
    freq_default:'Monthly (minimum 10 meetings per academic year)',
    roles:{
      'Chairperson':'Provides institutional direction to the cell; facilitates industry and government linkages; approves entrepreneurship programmes and MOUs with industry; presides over annual career fair.',
      'Convener / Coordinator':'Plans and implements career guidance programmes, workshops, and seminars; maintains industry contact database; organises campus placement drives; coordinates with AYUSH industry partners; prepares quarterly activity reports.',
      'Member (Clinical Faculty)':'Guides students on clinical practice establishment, OPD setup, and clinical entrepreneurship; connects students with practising clinician entrepreneurs.',
      'Member (Basic Science Faculty)':'Guides students on research-based entrepreneurship, herbal product development, and quality control careers; connects students with pharmaceutical industry.',
      'Member (Administrative)':'Manages logistics of career events; maintains placement records; coordinates with HR representatives of visiting organisations.',
      'Student Representative':'Coordinates peer participation in cell activities; collects student career aspiration data; assists in organising student-led entrepreneurship initiatives.',
      'External Expert / Entrepreneur':'Provides industry perspective; mentors student entrepreneurs; judges business plan competitions; facilitates industry-academia linkages.',
    }
  },
  ethics:{
    basis:`The Institutional Ethics Committee (IEC) is constituted in accordance with the Indian Council of Medical Research (ICMR) National Ethical Guidelines for Biomedical and Health Research Involving Human Participants (2017); CCIM/NCISM guidelines for Ayurveda research ethics; Schedule Y of the Drugs and Cosmetics Act 1940; and the Central Drugs Standard Control Organisation (CDSCO) Good Clinical Practice Guidelines. The committee ensures that all research conducted at the institution involving human participants, animals, or biological materials adheres to ethical principles of autonomy, beneficence, non-maleficence, and justice. Its constitution is mandatory for any institution conducting clinical trials or PG research.`,
    freq_default:'Monthly or as required by research protocol submissions',
    roles:{
      'Chairperson':'Independent chairperson (not from the institution) who presides over all IEC meetings; ensures impartial review of research protocols; has final authority on protocol approval, rejection, or modification; signs all IEC certificates.',
      'Member Secretary':'Receives all research protocol submissions; prepares agenda; records and circulates minutes; maintains IEC files and correspondence; issues approval letters; coordinates with researchers for revisions; maintains the protocol registry.',
      'Member (Clinician – Medicine)':'Reviews clinical research protocols from the perspective of internal medicine; assesses risk-benefit ratio; evaluates informed consent documents; monitors ongoing studies.',
      'Member (Clinician – Surgery)':'Reviews surgical and procedural research protocols; evaluates patient safety aspects; assesses procedural risks in proposed studies.',
      'Member (Pharmacologist/Subject Expert)':'Reviews drug/formulation-related research; evaluates pharmacological safety data; assesses Ayurvedic formulation research protocols; advises on dose selection and safety monitoring.',
      'Legal Expert / Advocate':'Advises on legal aspects of research ethics; reviews consent forms for legal adequacy; advises on liability and indemnity matters; ensures compliance with applicable laws.',
      'Lay Person / Community Representative':'Represents community interests and patient perspective; assesses acceptability of research to the community; ensures research benefits are accessible to the general public.',
      'Woman Member':'Ensures gender perspective in research protocols; reviews research involving women participants for ethical adequacy; advocates for women\'s health research priorities.',
      'Statistician / Research Expert':'Reviews statistical design and sample size justification of protocols; advises on data safety and monitoring; reviews statistical analysis plans.',
    }
  },
  hospital_mgmt:{
    basis:`The Hospital Management Committee is constituted in accordance with NCISM (Minimum Standards of Education in Indian Medicine) Regulations 2021, which mandate Ayurveda Medical Colleges to have a functional Hospital Management Committee for effective governance of the attached teaching hospital. The committee ensures quality patient care, efficient hospital administration, regulatory compliance, and systematic development of hospital infrastructure and services. It functions in accordance with the Clinical Establishments (Registration and Regulation) Act 2010 and State Clinical Establishments Rules.`,
    freq_default:'Monthly (minimum 12 meetings per academic year)',
    roles:{
      'Chairperson / Principal':'Provides overall leadership to hospital management; chairs monthly HMC meetings; interfaces between hospital management and college administration; ensures regulatory compliance; approves major hospital development initiatives.',
      'Medical Superintendent':'Day-to-day administrative and clinical management of the hospital; implements HMC decisions; manages medical and paramedical staff; maintains hospital statistics and records; liaises with regulatory bodies.',
      'Member (OPD In-charge)':'Manages OPD services; monitors patient footfall and satisfaction; ensures smooth OPD workflow; implements outpatient protocols; reports OPD statistics to HMC.',
      'Member (IPD In-charge)':'Manages indoor patient services; monitors bed occupancy; ensures quality inpatient care; implements IPD protocols; reports IPD statistics to HMC.',
      'HOD – Panchakarma':'Manages Panchakarma therapy unit; ensures quality of Panchakarma services; monitors patient safety in Panchakarma procedures; trains interns and UG/PG students.',
      'Nursing Superintendent':'Manages nursing staff; ensures quality nursing care; maintains nursing standards; coordinates with medical staff; manages nursing rosters.',
      'Pharmacist In-charge':'Manages hospital pharmacy; ensures availability of essential Ayurvedic medicines; maintains pharmacy records; ensures proper dispensing practices; manages drug store.',
      'Member (Administrative)':'Manages non-clinical hospital administration; handles HR matters for hospital staff; manages contracts and procurement; maintains administrative records.',
      'Accounts Officer':'Manages hospital accounts; prepares financial reports for HMC; monitors revenue and expenditure; manages billing systems.',
      'Stores & Purchase Officer':'Manages procurement of medicines, equipment, and supplies; maintains store records; implements purchase policies approved by HMC.',
    }
  },
  research:{
    basis:`The Research Cell (Institutional Research Committee) is constituted in accordance with NCISM Regulations 2021, which mandate Ayurveda Medical Colleges to promote research culture and manage PG research activities. The cell operates in consonance with ICMR guidelines, the affiliating university's research regulations (Rajiv Gandhi University of Health Sciences, Karnataka), and the Ministry of AYUSH Research Policy 2022. Its mandate includes promotion of evidence-based Ayurveda research, facilitation of PG thesis research, coordination with external funding agencies, and maintenance of research quality standards.`,
    freq_default:'Monthly (minimum 10 meetings per academic year)',
    roles:{
      'Chairperson':'Provides strategic leadership to institutional research; approves research priorities; facilitates external funding and collaboration; presides over annual research day; interfaces with RGUHSS and NCISM on research matters.',
      'Convener / Research Coordinator':'Coordinates all PG research activities; maintains research protocol registry; organises research methodology workshops; prepares annual research report; liaises with IEC; manages research documentation.',
      'PG Guide (Kayachikitsa)':'Guides MD/PhD scholars in Kayachikitsa; reviews and approves research protocols in the department; ensures adherence to research ethics; participates in synopsis and thesis evaluation.',
      'PG Guide (Dravyaguna)':'Guides MD/PhD scholars in Dravyaguna; reviews pharmacognosy and phytochemistry research protocols; ensures botanical and pharmacological research standards.',
      'PG Guide (Rasashastra & BK)':'Guides MD/PhD scholars in Rasashastra & Bhaishajya Kalpana; reviews pharmaceutical research protocols; ensures quality control research standards.',
      'PG Guide (Shalya Tantra)':'Guides MD/PhD scholars in Shalya Tantra; reviews surgical and Ksharasutra research protocols; participates in clinical research oversight.',
      'Biostatistician / Statistician':'Advises on statistical design of research protocols; reviews sample size calculations; assists in data analysis; guides scholars in statistical software use.',
      'Librarian':'Facilitates access to research literature; provides Turnitin/plagiarism check facility; assists in systematic review and literature search; maintains journal subscriptions.',
      'Student Representative (PG Scholar)':'Represents PG scholars\' research interests; brings forward difficulties in research process; assists in peer orientation for new scholars.',
    }
  },
  sports_cultural:{
    basis:`The Sports and Cultural Cell is constituted in accordance with NCISM Regulations 2021, which mandate Ayurveda Medical Colleges to provide sports and cultural facilities for holistic student development. The cell is further constituted in line with the Association of Indian Universities (AIU) guidelines for inter-university sports, Ministry of Youth Affairs and Sports guidelines, and the affiliating university's sports and cultural activity regulations. The cell promotes physical fitness, teamwork, artistic expression, and overall personality development among students.`,
    freq_default:'Monthly (minimum 10 meetings per academic year; pre-event meetings as required)',
    roles:{
      'Chairperson':'Provides institutional support for sports and cultural activities; approves annual sports and cultural calendar; facilitates infrastructure development; presides over annual sports day and cultural fest.',
      'Sports Coordinator':'Plans and implements the annual sports calendar; selects and trains students for inter-college and inter-university competitions; maintains sports equipment; prepares sports activity report; liaises with AIU/university for sports events.',
      'Cultural Coordinator':'Plans and implements the annual cultural calendar; organises cultural fest, National/State day celebrations, and Ayurveda Day events; selects and trains students for cultural competitions; maintains cultural activity report.',
      'Physical Education Instructor':'Conducts regular physical training sessions; coaches students in specific sports; maintains playground and sports equipment; assists Sports Coordinator in event organisation.',
      'Member (Faculty)':'Supports sports and cultural events; acts as faculty in-charge during competitions; assists in event coordination; encourages student participation.',
      'Student Representative (Sports – Male)':'Coordinates male student participation in sports events; captains/leads sports teams; communicates sports schedule to peers.',
      'Student Representative (Sports – Female)':'Coordinates female student participation in sports events; leads female sports teams; communicates sports schedule to peers.',
      'Student Representative (Cultural – Male)':'Coordinates male student participation in cultural events; leads cultural performances; assists in cultural event organisation.',
      'Student Representative (Cultural – Female)':'Coordinates female student participation in cultural events; leads cultural performances; assists in cultural event organisation.',
    }
  },
  library:{
    basis:`The Library Committee is constituted in accordance with NCISM (Minimum Standards) Regulations 2021, which specify minimum library resources and management standards for Ayurveda Medical Colleges. The committee is further constituted in line with UGC guidelines on University and College Libraries and the affiliating university's library statutes. The committee ensures that the library collection, services, and infrastructure meet NCISM standards and adequately support teaching, learning, and research activities of the institution.`,
    freq_default:'Quarterly (minimum 4 meetings per academic year)',
    roles:{
      'Chairperson':'Provides institutional direction to library development; approves major acquisitions and infrastructure upgrades; ensures library budget allocation; presides over annual library review meeting.',
      'Convener / Librarian':'Manages day-to-day library operations; curates and develops library collection; manages library staff; implements library automation; prepares accession register and annual library report; coordinates interlibrary loan services; maintains journal subscriptions.',
      'Member (Clinical Faculty)':'Advises on clinical textbook and journal acquisitions; identifies outdated resources for weeding; recommends e-resources relevant to clinical departments.',
      'Member (Basic Science Faculty)':'Advises on basic science textbook and journal acquisitions; identifies resource gaps; recommends e-databases for basic science research.',
      'Member (Administrative)':'Manages library budget and accounts; coordinates procurement procedures; ensures timely payment of journal subscriptions; assists in audit compliance.',
      'Assistant Librarian':'Assists Librarian in cataloguing, classification, and day-to-day services; manages circulation counter; assists in library automation; coordinates with students on library services.',
      'Student Representative (UG)':'Represents BAMS student library needs; provides feedback on collection adequacy; suggests additions to student reading list; assists in library orientation for new students.',
      'Student Representative (PG)':'Represents PG scholar research resource needs; provides feedback on research journal access; suggests database subscriptions; assists in research literature orientation.',
    }
  },
  examination:{
    basis:`The Examination Cell (Internal Assessment and Examination Committee) is constituted in accordance with NCISM Regulations 2021, which mandate standardised internal assessment and examination processes in Ayurveda Medical Colleges, and the affiliating university's (RGUHS) examination regulations and statutes. The committee ensures fair, transparent, and systematic conduct of internal assessments, University examinations, and practical/clinical examinations. It implements the NCISM-mandated Assessment Blueprint and ensures compliance with all University examination circulars and notifications.`,
    freq_default:'Monthly during examination periods; quarterly otherwise',

let state={};
const STORAGE_KEY='jagm_cells_v4';

function loadState(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)state=JSON.parse(s);}catch(e){}
  CELLS.forEach(c=>{
    if(!state[c.id])state[c.id]={period:'',date_formed:'',freq:'',coordinator:'',coordinator_desig:'',email:'',phone:'',objective:'',fixed_names:{},extra_members:[],meetings:[],notes:''};
    if(!state[c.id].fixed_names)state[c.id].fixed_names={};
    if(!state[c.id].extra_members)state[c.id].extra_members=[];
    if(!state[c.id].date_formed)state[c.id].date_formed='';
    if(!state[c.id].freq)state[c.id].freq='';
  });
}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));showToast('Auto-saved ✓');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

function buildTabs(){
  const bar=document.getElementById('tab-bar');
  CELLS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(i===0?' active':'');
    b.textContent=c.label;b.dataset.id=c.id;
    b.onclick=()=>switchTab(c.id);
    bar.appendChild(b);
  });
  const dl=document.createElement('button');
  dl.className='tab-btn downloads-tab';
  dl.textContent='📥 Downloads';dl.dataset.id='downloads';
  dl.onclick=()=>switchTab('downloads');
  bar.appendChild(dl);
}
function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.dataset.id===id));
}

function buildPanels(){
  const container=document.getElementById('panels-container');
  CELLS.forEach((c,i)=>{
    const div=document.createElement('div');
    div.className='tab-panel'+(i===0?' active':'');
    div.dataset.id=c.id;
    div.innerHTML=panelHTML(c);
    container.appendChild(div);
  });
  // Downloads panel
  const dl=document.createElement('div');
  dl.className='tab-panel';dl.dataset.id='downloads';
  dl.innerHTML=downloadsHTML();
  container.appendChild(dl);
}

function updateDownloadMeta(){
  CELLS.forEach(c=>{
    const s=state[c.id];
    const el=document.getElementById(`dl_meta_${c.id}`);
    if(!el)return;
    const members=(CELL_MEMBERS[c.id]||[]).length+(s.extra_members||[]).length;
    const named=Object.values(s.fixed_names||{}).filter(v=>v.trim()).length;
    el.innerHTML=`<span>Period: ${s.period||'Not set'}</span><span>Formed: ${s.date_formed||'Not set'}</span><span>Members: ${members}</span><span style="background:${named===members?'#c6f6d5':named>0?'#fefcbf':'#fed7d7'};color:${named===members?'#22543d':named>0?'#744210':'#742a2a'}">${named}/${(CELL_MEMBERS[c.id]||[]).length} names filled</span>`;
  });
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
function savePanel(id){
  const s=state[id];
  ['period','coordinator','coordinator_desig','email','phone','objective','notes','date_formed'].forEach(f=>{
    const el=document.getElementById(`${id}_${f}`);if(el)s[f]=el.value;
  });
  const freqEl=document.getElementById(`${id}_freq`);
  const freqCustomEl=document.getElementById(`${id}_freq_custom`);
  if(freqEl){
    if(freqEl.value==='custom'&&freqCustomEl) s.freq=freqCustomEl.value;
    else s.freq=freqEl.value;
  }
  s.fixed_names={};
  document.querySelectorAll(`#${id}_fixed_body .name-input`).forEach(inp=>{s.fixed_names[inp.dataset.key]=inp.value;});
  s.extra_members=[];
  document.querySelectorAll(`#${id}_extra_body tr`).forEach(tr=>{
    const ins=tr.querySelectorAll('input');
    s.extra_members.push({name:ins[0].value,desig:ins[1].value,role:ins[2].value});
  });
  s.meetings=[];
  document.querySelectorAll(`#${id}_meetings_container .meeting-entry`).forEach(me=>{
    const mid=me.dataset.mid;
    const agenda=[];me.querySelectorAll(`.ag-${mid} input`).forEach(i=>{if(i.value)agenda.push(i.value);});
    const decisions=[];me.querySelectorAll(`.dc-${mid} input`).forEach(i=>{if(i.value)decisions.push(i.value);});
    const actions=[];me.querySelectorAll(`.ac-${mid}`).forEach(r=>{
      const ins=r.querySelectorAll('input');
      if(ins[0]&&(ins[0].value||ins[1].value))actions.push({action:ins[0].value,person:ins[1].value});
    });
    s.meetings.push({mid,date:me.querySelector('.m-date').value,time:me.querySelector('.m-time').value,
      venue:me.querySelector('.m-venue').value,members_present:me.querySelector('.m-members').value,
      agenda,decisions,actions,next_meeting:me.querySelector('.m-next').value});
  });
  saveState();
  updateDownloadMeta();
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
function renderPanel(id){
  const s=state[id];
  ['period','coordinator','coordinator_desig','email','phone','objective','notes','date_formed'].forEach(f=>{
    const el=document.getElementById(`${id}_${f}`);if(el)el.value=s[f]||'';
  });
  const freqEl=document.getElementById(`${id}_freq`);
  if(freqEl){
    const found=FREQ_OPTIONS.includes(s.freq);
    if(found||!s.freq){freqEl.value=s.freq||'';}
    else{freqEl.value='custom';document.getElementById(`${id}_freq_custom_wrap`).style.display='flex';const fc=document.getElementById(`${id}_freq_custom`);if(fc)fc.value=s.freq;}
    freqEl.addEventListener('change',function(){
      const wrap=document.getElementById(`${id}_freq_custom_wrap`);
      if(wrap)wrap.style.display=this.value==='custom'?'flex':'none';
      savePanel(id);
    });
  }
  document.querySelectorAll(`#${id}_fixed_body .name-input`).forEach(inp=>{
    inp.value=s.fixed_names[inp.dataset.key]||'';
    inp.addEventListener('change',()=>savePanel(id));
  });
  const eb=document.getElementById(`${id}_extra_body`);eb.innerHTML='';
  (s.extra_members||[]).forEach(m=>addExtraMemberRow(id,m));
  const mc=document.getElementById(`${id}_meetings_container`);mc.innerHTML='';
  (s.meetings||[]).forEach(m=>addMeetingEntry(id,m));
  ['period','coordinator','coordinator_desig','email','phone','objective','notes','date_formed'].forEach(f=>{
    const el=document.getElementById(`${id}_${f}`);if(el)el.addEventListener('change',()=>savePanel(id));
  });
}

  const acI=(data.actions&&data.actions.length?data.actions:[{action:'',person:''},{action:'',person:''}]).map(a=>`<tr class="ac-${mid}"><td><input type="text" value="${esc(a.action||'')}" placeholder="Action point" style="width:100%;border:1px solid #cbd5e0;border-radius:4px;padding:4px"/></td><td><input type="text" value="${esc(a.person||'')}" placeholder="Responsible person" style="width:100%;border:1px solid #cbd5e0;border-radius:4px;padding:4px"/></td><td class="no-print"><button class="btn-tiny" onclick="this.closest('tr').remove()">✕</button></td></tr>`).join('');
  div.innerHTML=`
    <h4>Meeting Record – ${data.date||'New Meeting'}</h4>
    <button class="btn-sm btn-danger remove-meeting no-print" onclick="this.closest('.meeting-entry').remove()">✕ Remove</button>
    <div class="row">

function addListItem(listId,cls,ph){

function addActionRow(tbodyId,cls){
  const tb=document.getElementById(tbodyId);const tr=document.createElement('tr');tr.className=cls;
  tr.innerHTML=`<td><input type="text" placeholder="Action point" style="width:100%;border:1px solid #cbd5e0;border-radius:4px;padding:4px"/></td><td><input type="text" placeholder="Responsible person" style="width:100%;border:1px solid #cbd5e0;border-radius:4px;padding:4px"/></td><td class="no-print"><button class="btn-tiny" onclick="this.closest('tr').remove()">✕</button></td>`;
  tb.appendChild(tr);
}
function printPanel(id){savePanel(id);switchTab(id);setTimeout(()=>window.print(),300);}

// ── WORD HELPERS ───────────────────────────────────────────────────────────────
function getDocxHelpers(){
  const {Document,Packer,Paragraph,Table,TableRow,TableCell,TextRun,HeadingLevel,AlignmentType,BorderStyle,WidthType,ShadingType}=docx;
  const bdr={style:BorderStyle.SINGLE,size:4,color:'1a3a5c'};
  const bdrLight={style:BorderStyle.SINGLE,size:2,color:'cbd5e0'};
  const mkTR=(txt,bold,shade,borders)=>new TableRow({children:[new TableCell({
    children:[new Paragraph({children:[new TextRun({text:txt||'',size:20,bold:!!bold})],spacing:{after:40,before:40}})],
    shading:{fill:shade||'FFFFFF'},
    borders:borders||{top:bdr,bottom:bdr,left:bdr,right:bdr},
    margins:{top:60,bottom:60,left:100,right:100}
  })]});
  const mkCell=(txt,bold,shade,span)=>new TableCell({
    children:[new Paragraph({children:[new TextRun({text:txt||'—',size:20,bold:!!bold})],spacing:{after:40,before:40}})],
    shading:{fill:shade||'FFFFFF'},
    borders:{top:bdr,bottom:bdr,left:bdr,right:bdr},
    margins:{top:60,bottom:60,left:100,right:100},
    ...(span?{columnSpan:span}:{})
  });
  const mkPara=(text,opts={})=>new Paragraph({
    alignment:opts.align||AlignmentType.LEFT,
    children:[new TextRun({text:text||'',size:opts.size||22,bold:!!opts.bold,color:opts.color||'000000',italics:!!opts.italic})],
    spacing:{after:opts.after||80,before:opts.before||0},
    ...(opts.heading?{heading:opts.heading}:{})
  });
  return {Document,Packer,Paragraph,Table,TableRow,TableCell,TextRun,HeadingLevel,AlignmentType,BorderStyle,WidthType,bdr,bdrLight,mkCell,mkPara,mkTR};
}

// ── MEETING RECORDS WORD ───────────────────────────────────────────────────────
async function downloadMeetingWord(id){
  savePanel(id);
  const s=state[id];const cell=CELLS.find(c=>c.id===id);
  const {Document,Packer,Paragraph,Table,TableRow,TableCell,TextRun,AlignmentType,BorderStyle,WidthType,bdr,mkCell,mkPara}=getDocxHelpers();
  const fixed=CELL_MEMBERS[id]||[];
  const children=[
    mkPara('Jain AGM Ayurvedic Medical College & Hospital, Varur',{bold:true,size:28,align:AlignmentType.CENTER,after:80}),
    mkPara(cell.full,{bold:true,size:24,color:'1a3a5c',align:AlignmentType.CENTER,after:80}),
    mkPara(`Academic Period: ${s.period||'—'}   |   Date of Formation: ${s.date_formed||'—'}   |   Meeting Frequency: ${s.freq||'—'}`,{size:20,align:AlignmentType.CENTER,after:200}),
    mkPara('Cell Details',{bold:true,size:24,after:80}),
    ...['Coordinator','coordinator_desig','email','phone'].map((f,i)=>mkPara(['Coordinator: '+s.coordinator,'Designation: '+s.coordinator_desig,'Email: '+s.email,'Phone: '+s.phone][i])),
    mkPara(''),
    mkPara('Cell Members',{bold:true,size:24,after:80}),
    new Table({
      width:{size:100,type:WidthType.PERCENTAGE},
      rows:[
        new TableRow({children:[mkCell('S.No',true,'1a3a5c'),mkCell('Designation',true,'1a3a5c'),mkCell('Post',true,'1a3a5c'),mkCell('Name of Person',true,'1a3a5c')]}),
        ...fixed.map(m=>new TableRow({children:[mkCell(String(m.sno),'','EBF4FF'),mkCell(m.desig,true,'EBF4FF'),mkCell(m.post,'','F7FAFC'),mkCell(s.fixed_names[`${id}_${m.sno}`]||'—')]})),
        ...(s.extra_members||[]).map((m,i)=>new TableRow({children:[mkCell(String(fixed.length+i+1)),mkCell(m.name),mkCell(m.desig),mkCell(m.role)]}))
      ]
    }),
    mkPara('',{after:200}),
    mkPara('Meeting Records',{bold:true,size:24,after:80}),
  ];
  if(!s.meetings||!s.meetings.length){children.push(mkPara('No meetings recorded.'));}
  else{
    s.meetings.forEach((m,mi)=>{
      children.push(mkPara(`Meeting ${mi+1}  —  ${m.date||'Date N/A'}`,{bold:true,size:22,color:'2d6a9f',after:80}));
      children.push(mkPara(`Date & Time: ${m.date||'—'} ${m.time||''}`));
      children.push(mkPara(`Venue: ${m.venue||'—'}`));
      children.push(mkPara('Members Present:',{bold:true,after:40}));
      (m.members_present||'').split('\n').filter(Boolean).forEach(l=>children.push(mkPara('   • '+l)));
      children.push(mkPara('Agenda Items:',{bold:true,after:40}));
      (m.agenda||[]).forEach((a,ai)=>{if(a)children.push(mkPara(`   ${ai+1}. ${a}`));});
      children.push(mkPara('Decisions Taken:',{bold:true,after:40}));
      (m.decisions||[]).forEach((d,di)=>{if(d)children.push(mkPara(`   ${di+1}. ${d}`));});
      if(m.actions&&m.actions.filter(a=>a.action).length){
        children.push(mkPara('Action Points:',{bold:true,after:60}));
        children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
          new TableRow({children:[mkCell('Action Point',true,'D6E4F0'),mkCell('Responsible Person',true,'D6E4F0')]}),
          ...m.actions.filter(a=>a.action||a.person).map(a=>new TableRow({children:[mkCell(a.action),mkCell(a.person)]}))
        ]}));
        children.push(mkPara('',{after:80}));
      }
      children.push(mkPara(`Next Meeting Date: ${m.next_meeting||'—'}`));
      children.push(mkPara('',{after:160}));
      children.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
        new TableRow({children:[mkCell('Cell Coordinator\n\n\nSignature & Date','','F7FAFC'),mkCell('Principal\n\n\nSignature & Date','','F7FAFC'),mkCell('Member 1\n\n\nSignature','','F7FAFC'),mkCell('Member 2\n\n\nSignature','','F7FAFC'),mkCell('Member 3\n\n\nSignature','','F7FAFC')]})
      ]}));
      children.push(mkPara('',{after:240}));
    });
  }
  const doc=new Document({sections:[{properties:{},children}]});
  const blob=await Packer.toBlob(doc);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${cell.full.replace(/[^a-z0-9]/gi,'_')}_MeetingRecords_${s.period||'Report'}.docx`;a.click();
  showToast('Meeting records Word file downloaded!');
}

// ── CONSTITUTION DOCUMENT WORD ────────────────────────────────────────────────

function getDefaultObjective(id){
  const obj={
    anti_ragging:'To ensure a safe, ragging-free campus environment; to receive, investigate, and resolve ragging complaints in a time-bound and fair manner; to conduct regular sensitisation programmes for students, faculty, and staff; and to ensure full compliance with Supreme Court directives and UGC Anti-Ragging Regulations.',
    icc:'To provide a safe, dignified, and harassment-free working and learning environment for all women; to receive and investigate complaints of sexual harassment in a fair, confidential, and time-bound manner; and to implement preventive and awareness measures as mandated under the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013.',
    sc_st:'To ensure equal opportunity and non-discrimination for students belonging to Scheduled Castes and Scheduled Tribes; to address grievances related to caste-based discrimination; to facilitate welfare schemes, scholarships, and support services; and to create a sensitised and inclusive campus environment.',
    grievance:'To provide a fair, transparent, and time-bound mechanism for redressal of student grievances related to academics, examinations, admissions, hostel, and other institutional matters; to ensure that no student suffers on account of raising a legitimate grievance; and to maintain a constructive student-institution relationship.',
    alumni:'To maintain an active, engaged alumni network; to leverage alumni expertise for student mentorship, curriculum enrichment, and institutional development; to organise regular alumni interactions and facilitate professional networking among graduates and current students.',
    entrepreneurship:'To develop entrepreneurial mindset and career readiness among Ayurveda graduates; to provide career guidance, placement support, and industry linkages; to promote self-employment and innovation in the AYUSH sector; and to facilitate skill development programmes aligned with National Education Policy 2020.',
    ethics:'To ensure ethical conduct of all research involving human participants, animals, and biological materials at the institution; to review and approve research protocols; to protect the rights and welfare of research participants; and to ensure compliance with ICMR Guidelines and applicable laws.',
    hospital_mgmt:'To ensure quality patient care, efficient administration, and regulatory compliance of the teaching hospital; to plan and monitor hospital development; to review hospital statistics and implement quality improvement measures; and to ensure that the hospital meets NCISM standards for a teaching hospital.',
    research:'To promote a culture of evidence-based Ayurveda research; to facilitate and oversee PG thesis research; to coordinate with the IEC and funding agencies; to organise research capacity building programmes; and to ensure research quality and ethical standards across all institutional research activities.',
    sports_cultural:'To promote physical fitness, teamwork, and holistic personality development through sports; to preserve and promote Indian cultural traditions through cultural activities; to encourage participation in inter-college and inter-university events; and to provide a platform for students to develop talents beyond academics.',
    library:'To ensure that the library collection, services, and infrastructure meet NCISM minimum standards; to support teaching, learning, and research through adequate information resources; to promote digital literacy and research skills; and to implement efficient library management systems.',
    examination:'To ensure fair, transparent, and systematic conduct of internal assessments and University examinations; to implement the NCISM Assessment Blueprint; to maintain examination integrity and confidentiality; and to ensure full compliance with RGUHS examination regulations and notifications.',
  };
  return obj[id]||'As per NCISM Regulations 2021 and applicable statutory provisions.';
}

function generalProvisions(id){
  return [
    '1. Quorum: A majority of members (more than 50%) shall constitute a quorum for any meeting of the cell.',
    '2. Minutes: Minutes of all meetings shall be recorded, confirmed, and maintained in a dedicated register.',
    '3. Confidentiality: Members shall maintain strict confidentiality of all proceedings, complaints, and personal information dealt with by the cell.',
    '4. Term: The term of the cell members shall be one academic year, renewable by the Principal.',
    '5. Amendment: The Principal, in consultation with the cell coordinator, may amend the composition or terms of reference of the cell in accordance with applicable regulations.',
    '6. Compliance: All members shall comply with the applicable NCISM Regulations, UGC Guidelines, Supreme Court directives, and other statutory provisions relevant to this cell.',
    '7. Report: The cell shall submit an annual report of its activities to the Principal and, where required, to the affiliating university and NCISM.',
  ];
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
